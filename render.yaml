services:
  - type: web
    name: chatify
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: WRITE_LOCAL_JSON_BACKUP
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "536870912"
      - key: GIPHY_API_KEY
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: FORCE_TURN_RELAY
        value: "false"
      - key: MODERATION_ARCHIVE_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_MAX_COPY_BYTES
        value: "4194304"
      - key: MONGO_SAVE_DEBOUNCE_MS
        value: "2000"
      - key: CHAT_HISTORY_LIMIT
        value: "50"
      - key: UNSENT_CHAT_UPLOAD_TTL_MS
        value: "21600000"
      - key: MEMORY_WARN_MB
        value: "300"
      - key: MEMORY_CLEANUP_MB
        value: "340"
      - key: MEMORY_CRITICAL_MB
        value: "440"
      - key: MEMORY_CRITICAL_STRIKES
        value: "3"
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: "900000"
      - key: MAX_CONCURRENT_UPLOADS_PER_USER
        value: "2"
      - key: MAX_CONCURRENT_UPLOAD_REQUESTS
        value: "6"
      - key: MEDIA_LOCAL_CACHE_TTL_MS
        value: "1200000"
      - key: MEDIA_LOCAL_CACHE_MAX_FILE_BYTES
        value: "134217728"
      - key: LOCAL_ARCHIVE_ENABLED
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
      - key: MEMORY_GUARD_RESTART
        value: "false"
      - key: MEMORY_RESTART_HEAP_MB
        value: "240"
      - key: MEMORY_RESTART_EXTERNAL_MB
        value: "192"
      - key: TELEGRAM_TOPIC_RETRY_COOLDOWN_MS
        value: "21600000"
