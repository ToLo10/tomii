services:
  - type: web
    name: chatify
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: REQUIRE_MONGODB
        value: "true"
      - key: ALLOW_LOCAL_JSON_FALLBACK
        value: "false"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PART_SIZE_BYTES
        value: "8388608"
      - key: R2_PRESIGNED_UPLOAD_TTL_SECONDS
        value: "900"
      - key: R2_PRESIGNED_DOWNLOAD_TTL_SECONDS
        value: "900"
      - key: REQUIRE_EXTERNAL_MEDIA_STORAGE
        value: "true"
      - key: WRITE_LOCAL_JSON_BACKUP
        value: "false"
      - key: MAX_UPLOAD_BYTES
        value: "536870912"
      - key: GIPHY_API_KEY
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: FORCE_TURN_RELAY
        value: "false"
      - key: MODERATION_ARCHIVE_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_MAX_COPY_BYTES
        value: "4194304"
      - key: MONGO_SAVE_DEBOUNCE_MS
        value: "2000"
      - key: CHAT_HISTORY_LIMIT
        value: "50"
      - key: UNSENT_CHAT_UPLOAD_TTL_MS
        value: "21600000"
      - key: MEMORY_WARN_MB
        value: "300"
      - key: MEMORY_CLEANUP_MB
        value: "340"
      - key: MEMORY_CRITICAL_MB
        value: "440"
      - key: MEMORY_CRITICAL_STRIKES
        value: "3"
      - key: HTTP_REQUEST_TIMEOUT_MS
        value: "900000"
      - key: UPLOAD_CHUNK_SIZE
        value: "8388608"
      - key: MAX_CONCURRENT_UPLOADS_PER_USER
        value: "2"
      - key: MAX_CONCURRENT_UPLOAD_REQUESTS
        value: "6"
      - key: GRIDFS_CHUNK_SIZE
        value: "4194304"
      - key: MEDIA_LOCAL_CACHE_TTL_MS
        value: "1200000"
      - key: MEDIA_LOCAL_CACHE_MAX_FILE_BYTES
        value: "134217728"
      - key: VIDEO_COMPATIBILITY_ENABLED
        value: "false"
      - key: VIDEO_COMPATIBILITY_ALLOW_SERVER_WORKER
        value: "false"
      - key: VIDEO_COMPATIBILITY_MAX_BYTES
        value: "536870912"
      - key: VIDEO_COMPATIBILITY_MAX_QUEUE
        value: "50"
      - key: VIDEO_COMPATIBILITY_TIMEOUT_MS
        value: "1800000"
      - key: FFMPEG_PATH
        value: "ffmpeg"
      - key: FFPROBE_PATH
        value: "ffprobe"
      - key: LOCAL_ARCHIVE_ENABLED
        value: "false"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320"
      - key: MEMORY_GUARD_RESTART
        value: "false"
      - key: MEMORY_RESTART_HEAP_MB
        value: "240"
      - key: MEMORY_RESTART_EXTERNAL_MB
        value: "192"
      - key: TELEGRAM_TOPIC_RETRY_COOLDOWN_MS
        value: "21600000"
      - key: ANALYTICS_EVENT_TTL_DAYS
        value: "90"
      - key: ANALYTICS_FLUSH_INTERVAL_MS
        value: "10000"
      - key: ANALYTICS_ACTIVE_WINDOW_MS
        value: "150000"
      - key: ANALYTICS_LOCAL_BACKUP
        value: "false"
      # Optional AI provider. Local TOMI help/safety/analytics logic works
      # without these secrets; enable remote calls only after reviewing privacy.
      - key: AI_REMOTE_ENABLED
        value: "false"
      - key: AI_REMOTE_SAFETY_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: "https://api.openai.com/v1/chat/completions"
      - key: AI_MODEL
        value: "gpt-4o-mini"
      - key: AI_TIMEOUT_MS
        value: "8000"
      - key: AUDIO_RECORDING_BITRATE
        value: "160000"
