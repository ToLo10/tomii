<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080611">
    <title>TOMI - تسجيل الدخول</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-layout">
        <section class="showcase-panel" aria-label="واجهة TOMI التعريفية">
            <img class="showcase-reference" src="assets/tomi-showcase.webp"
                 alt="واجهة TOMI تعرض محادثات خاصة ومكالمات وغرف عامة" draggable="false">
        </section>

        <section class="auth-side">
            <div class="top-brand" aria-label="TOMI">
                <span class="brand-word">TOMI</span>
                <span class="brand-mark" aria-hidden="true">
                    <i class="fa-solid fa-comment"></i>
                    <i class="fa-solid fa-comment"></i>
                </span>
            </div>

            <aside class="auth-card" aria-labelledby="authTitle">
                <div class="panel-brand" aria-label="TOMI">
                    <span class="brand-word">TOMI</span>
                    <span class="brand-mark" aria-hidden="true">
                        <i class="fa-solid fa-comment"></i>
                        <i class="fa-solid fa-comment"></i>
                    </span>
                </div>

                <header class="auth-header">
                    <h1 id="authTitle">أهلاً برجعتك</h1>
                    <p>سجّل دخولك وخلك قريب من أصدقائك</p>
                </header>

                <div class="tabs" role="tablist" aria-label="تسجيل الدخول أو إنشاء حساب">
                    <button type="button" class="tab-btn active" id="loginTabBtn" role="tab"
                            aria-selected="true" aria-controls="loginForm">تسجيل الدخول</button>
                    <button type="button" class="tab-btn" id="registerTabBtn" role="tab"
                            aria-selected="false" aria-controls="registerForm">إنشاء حساب</button>
                </div>

                <div class="message-stack" aria-live="polite">
                    <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive"></div>
                    <div class="success-msg" id="successMsg" role="status" aria-live="polite"></div>
                </div>

                <form class="form-section active" id="loginForm" novalidate>
                    <div class="input-group">
                        <label for="loginUsername">اسم المستخدم</label>
                        <div class="input-shell">
                            <i class="fa-regular fa-user field-icon" aria-hidden="true"></i>
                            <input type="text" id="loginUsername" name="username" placeholder="أدخل اسم المستخدم"
                                   autocomplete="username" maxlength="32" spellcheck="false" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">كلمة المرور</label>
                        <div class="input-shell password-shell">
                            <input type="password" id="loginPassword" name="password" placeholder="أدخل كلمة المرور"
                                   autocomplete="current-password" required>
                            <button type="button" class="toggle-password" data-target="loginPassword"
                                    aria-label="إظهار كلمة المرور" title="إظهار/إخفاء كلمة المرور">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button class="submit-btn" id="loginSubmitBtn" type="submit">
                        <i class="fa-solid fa-spinner fa-spin btn-spinner"></i>
                        <span>تسجيل الدخول</span>
                        <i class="fa-solid fa-right-to-bracket btn-icon"></i>
                    </button>
                </form>

                <form class="form-section" id="registerForm" novalidate>
                    <div class="input-group">
                        <label for="regUsername">اسم المستخدم</label>
                        <div class="input-shell">
                            <i class="fa-regular fa-user field-icon" aria-hidden="true"></i>
                            <input type="text" id="regUsername" name="username" placeholder="4 أحرف على الأقل"
                                   autocomplete="username" maxlength="32" spellcheck="false" required>
                        </div>
                        <div class="field-help" id="usernameHint">4 أحرف على الأقل، بدون مسافات.</div>
                    </div>

                    <div class="input-group">
                        <label for="regDisplayName">الاسم المعروض <span class="hint">(اختياري)</span></label>
                        <div class="input-shell">
                            <i class="fa-regular fa-id-badge field-icon" aria-hidden="true"></i>
                            <input type="text" id="regDisplayName" name="displayName"
                                   placeholder="الاسم الذي سيظهر للآخرين" autocomplete="name" maxlength="60">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">كلمة المرور <span class="hint">(6 أحرف على الأقل)</span></label>
                        <div class="input-shell password-shell">
                            <input type="password" id="regPassword" name="password" placeholder="أدخل كلمة المرور"
                                   autocomplete="new-password" minlength="6" required>
                            <button type="button" class="toggle-password" data-target="regPassword"
                                    aria-label="إظهار كلمة المرور" title="إظهار/إخفاء كلمة المرور">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPasswordConfirm">تأكيد كلمة المرور</label>
                        <div class="input-shell password-shell">
                            <input type="password" id="regPasswordConfirm" name="passwordConfirm"
                                   placeholder="أعد إدخال كلمة المرور" autocomplete="new-password" minlength="6" required>
                            <button type="button" class="toggle-password" data-target="regPasswordConfirm"
                                    aria-label="إظهار كلمة المرور" title="إظهار/إخفاء كلمة المرور">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button class="submit-btn" id="registerSubmitBtn" type="submit">
                        <i class="fa-solid fa-spinner fa-spin btn-spinner"></i>
                        <span>إنشاء الحساب</span>
                        <i class="fa-solid fa-user-plus btn-icon"></i>
                    </button>
                </form>
            </aside>
        </section>
    </main>

<script>
        const loginTabBtn = document.getElementById('loginTabBtn');
        const registerTabBtn = document.getElementById('registerTabBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginSubmitBtn = document.getElementById('loginSubmitBtn');
        const registerSubmitBtn = document.getElementById('registerSubmitBtn');
        const regUsername = document.getElementById('regUsername');
        const usernameHint = document.getElementById('usernameHint');

        function hideMessages() {
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            errorMsg.textContent = '';
            successMsg.textContent = '';
        }

        function showError(message) {
            successMsg.classList.remove('show');
            errorMsg.textContent = message || 'حدث خطأ غير متوقع';
            errorMsg.classList.add('show');
        }

        function showSuccess(message) {
            errorMsg.classList.remove('show');
            successMsg.textContent = message || 'تمت العملية بنجاح';
            successMsg.classList.add('show');
        }

        function setLoading(button, loading) {
            if (!button) return;
            button.disabled = loading;
            button.classList.toggle('loading', loading);
        }

        function switchTab(tab) {
            hideMessages();

            const isLogin = tab === 'login';
            loginTabBtn.classList.toggle('active', isLogin);
            registerTabBtn.classList.toggle('active', !isLogin);
            loginTabBtn.setAttribute('aria-selected', String(isLogin));
            registerTabBtn.setAttribute('aria-selected', String(!isLogin));

            loginForm.classList.toggle('active', isLogin);
            registerForm.classList.toggle('active', !isLogin);

            document.body.classList.toggle('register-mode', !isLogin);

            setTimeout(() => {
                const target = isLogin
                    ? document.getElementById('loginUsername')
                    : document.getElementById('regUsername');
                target?.focus();
            }, 0);
        }

        loginTabBtn.addEventListener('click', () => switchTab('login'));
        registerTabBtn.addEventListener('click', () => switchTab('register'));

        document.querySelectorAll('.toggle-password').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const icon = button.querySelector('i');
                if (!input || !icon) return;

                const showing = input.type === 'text';
                input.type = showing ? 'password' : 'text';
                icon.className = showing ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
                button.setAttribute('aria-label', showing ? 'إظهار كلمة المرور' : 'إخفاء كلمة المرور');
            });
        });

        function usernameLength(value) {
            return Array.from(String(value || '').trim()).length;
        }

        function validatePublicUsername(username) {
            const clean = String(username || '').trim();
            const length = usernameLength(clean);

            if (!clean) return 'يرجى إدخال اسم المستخدم';
            if (length < 4) return 'اسم المستخدم للمستخدم العادي يجب أن يكون 4 أحرف على الأقل';
            if (length > 32) return 'اسم المستخدم يجب ألا يتجاوز 32 حرفاً';
            if (/\s/.test(clean)) return 'اسم المستخدم لا يمكن أن يحتوي على مسافات';

            return '';
        }

        regUsername.addEventListener('input', () => {
            const value = regUsername.value.trim();
            const length = usernameLength(value);

            if (!value) {
                usernameHint.textContent = '4 أحرف على الأقل، بدون مسافات.';
                usernameHint.style.color = '#8b88a8';
                return;
            }

            if (/\s/.test(value)) {
                usernameHint.textContent = 'اسم المستخدم لا يمكن أن يحتوي على مسافات.';
                usernameHint.style.color = '#fb7185';
                return;
            }

            if (length < 4) {
                usernameHint.textContent = `باقي ${4 - length} حرف للوصول للحد الأدنى.`;
                usernameHint.style.color = '#fbbf24';
                return;
            }

            usernameHint.textContent = 'اسم المستخدم صالح للتسجيل كمستخدم عادي.';
            usernameHint.style.color = '#34d399';
        });

        async function readJsonSafe(response) {
            try {
                return await response.json();
            } catch {
                return {};
            }
        }

        function savePublicProfile(data) {
            if (!data?.username) return;

            localStorage.setItem('chat_username', data.username);
            localStorage.setItem('username', data.username);
            localStorage.setItem('chat_userId', data.username);
            localStorage.setItem('chat_role', data.role || 'user');
            localStorage.setItem('chat_display_name', data.displayName || data.username);
            localStorage.setItem('chat_permissions', JSON.stringify(
                Array.isArray(data.permissions) ? data.permissions : []
            ));

            if (data.badge) {
                localStorage.setItem('chat_badge', JSON.stringify(data.badge));
            } else {
                localStorage.removeItem('chat_badge');
            }

            localStorage.removeItem('chat_password');
            localStorage.removeItem('chat_session_token');
            localStorage.removeItem('sessionToken');

            sessionStorage.removeItem('active_room_id');
            sessionStorage.removeItem('active_partner');
            sessionStorage.removeItem('active_room_is_host');
            sessionStorage.removeItem('active_room_max_users');
        }

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            hideMessages();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username) {
                showError('يرجى إدخال اسم المستخدم');
                return;
            }

            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            setLoading(loginSubmitBtn, true);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await readJsonSafe(response);

                if (!response.ok || !data.success) {
                    showError(data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
                    return;
                }

                savePublicProfile(data);
                showSuccess('تم تسجيل الدخول بنجاح');
                setTimeout(() => window.location.replace('index.html'), 350);
            } catch (error) {
                showError('تعذر الاتصال بالخادم. حاول مرة أخرى.');
            } finally {
                setLoading(loginSubmitBtn, false);
            }
        });

        registerForm.addEventListener('submit', async event => {
            event.preventDefault();
            hideMessages();

            const username = regUsername.value.trim();
            const displayName = document.getElementById('regDisplayName').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            const usernameError = validatePublicUsername(username);
            if (usernameError) {
                showError(usernameError);
                regUsername.focus();
                return;
            }

            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            if (password.length < 6) {
                showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return;
            }

            if (password !== passwordConfirm) {
                showError('كلمتا المرور غير متطابقتين');
                return;
            }

            setLoading(registerSubmitBtn, true);

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        displayName: displayName || username
                    })
                });

                const data = await readJsonSafe(response);

                if (!response.ok || !data.success) {
                    showError(data.error || 'تعذر إنشاء الحساب');
                    return;
                }

                savePublicProfile(data);
                showSuccess('تم إنشاء الحساب بنجاح');
                setTimeout(() => window.location.replace('index.html'), 350);
            } catch (error) {
                showError('تعذر الاتصال بالخادم. حاول مرة أخرى.');
            } finally {
                setLoading(registerSubmitBtn, false);
            }
        });

        async function restoreExistingSession() {
            try {
                const response = await fetch('/api/session', {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    localStorage.removeItem('chat_password');
                    localStorage.removeItem('chat_session_token');
                    localStorage.removeItem('sessionToken');
                    return;
                }

                const data = await readJsonSafe(response);
                if (data.success && data.username) {
                    savePublicProfile(data);
                    window.location.replace('index.html');
                }
            } catch {
                // إذا كان السيرفر غير متاح نبقى في صفحة تسجيل الدخول.
            }
        }

        const requestedTab = new URLSearchParams(window.location.search).get('tab');
        if (requestedTab === 'register') {
            switchTab('register');
        }

        restoreExistingSession();
    </script>
</body>
</html>
